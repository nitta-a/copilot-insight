name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-parser

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Build
        run: npm run package

      - name: Prepare VS Code binaries before firewall
        run: |
          set -euo pipefail
          wget https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/vscode.tar.gz
          mkdir -p .vscode-test
          tar -xzf /tmp/vscode.tar.gz -C .vscode-test --strip-components=1

      - name: Test
        run: xvfb-run -a npm test
        env:
          VSCODE_EXECUTABLE_PATH: ${{ github.workspace }}/.vscode-test/code
